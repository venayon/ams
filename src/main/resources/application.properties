# Spring Application Configuration
spring.application.name=award-management-system

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/award_db
spring.data.mongodb.database=award_db

# Alternatively, use these individual properties:
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=award_db
# spring.data.mongodb.username=
# spring.data.mongodb.password=

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.award=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# MongoDB Auto Index Creation
spring.data.mongodb.auto-index-creation=true
