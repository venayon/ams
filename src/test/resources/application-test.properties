# Test Configuration
spring.application.name=award-management-system-test

# MongoDB will be configured by Testcontainers
# spring.data.mongodb.uri is set dynamically in TestContainersConfiguration

# Logging
logging.level.com.example.award=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.test=INFO
logging.level.org.testcontainers=INFO

# Disable MongoDB auto-config health check in tests
management.health.mongo.enabled=false

# Test-specific settings
spring.data.mongodb.auto-index-creation=true
